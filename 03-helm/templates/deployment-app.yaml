apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-flask-app
spec:
  replicas: {{ .Values.flask.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-flask-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-flask-app
    spec:
      containers:
        - name: flask
          image: {{ .Values.flask.image }}
          ports:
            - containerPort: {{ .Values.flask.service.port }}
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:    
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-flask-service
spec:
  selector:
    app: {{ .Release.Name }}-flask-app
  type: {{ .Values.flask.service.type }}
  ports:
    - port: {{ .Values.flask.service.port }}
      targetPort: {{ .Values.flask.service.port }}
      nodePort: {{ .Values.flask.service.nodePort }}