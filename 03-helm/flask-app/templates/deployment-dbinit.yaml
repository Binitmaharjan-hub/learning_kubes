apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-flask-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-flask-db
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-flask-db
    spec:
      containers:
        - name: flask-db
          image: {{ .Values.mysql.image }}
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config        #CONFIG MAP NAME
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret        #SECRET NAME
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret        #SECRET NAME
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret        #SECRET NAME
                  key: DB_ROOT_PASSWORD     
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-flask-db-service
spec:
  selector:
    app: {{ .Release.Name }}-flask-db
  ports:
    - port: 3306  
      targetPort: 3306